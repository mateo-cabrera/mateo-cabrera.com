<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f0f3f5" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="96x96" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/archivo.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Marque la présence de JavaScript avant le premier paint : l'état masqué
		     des révélations au scroll est conditionné à cet attribut, donc sans JS
		     rien n'est jamais caché. -->
		<script>
			document.documentElement.dataset.js = '';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
